[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redaction"
version = "0.1.8"
description = "Simple redaction script"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Tammy DiPrima", email = "tdiprima@yahoo.com"}]
license = "MIT"
dependencies = [
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
    "rich-argparse>=1.7.1",
    # Presidio fetches its spaCy model with "python -m pip" on first run; uv/pipx venvs ship no pip
    "pip",
]
keywords = ["pii", "redaction", "presidio", "privacy", "text"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# PyPI rejects direct-URL dependencies and the model is not on PyPI, so it is pinned for development only
[dependency-groups]
dev = [
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "pytest>=8",
]

[project.scripts]
redact = "redaction.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["LICENSE"]
